<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/jayam-logo.png" />
    <link rel="apple-touch-icon" href="/jayam-logo.png" />
    <!-- The hero seal and nav use the logo first thing: fetch it early -->
    <link rel="preload" as="image" href="/jayam-logo.png" fetchpriority="high" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jayam Wellness — Bringing the best to your hands</title>
    <meta name="description" content="Simple, clean, plant-based wellness from Jayam — organic Moringa supplements and botanical skincare. Free U.S. shipping on orders $49+." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jayam Wellness" />
    <meta property="og:title" content="Jayam Wellness — Bringing the best to your hands" />
    <meta property="og:description" content="Simple, clean, plant-based wellness from Jayam — organic Moringa supplements and botanical skincare." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Intro film: first page of a visit only, never in the admin panel, for crawlers or
         for visitors who reduce motion. A black screen holds until the film appears. -->
    <script>
      (function () {
        try {
          var seen = sessionStorage.getItem('jayam_intro_seen');
          var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var bot = navigator.webdriver || /bot|crawl|spider|slurp|lighthouse|headless/i.test(navigator.userAgent);
          if (!seen && !calm && !bot && location.pathname.indexOf('/admin') !== 0) {
            document.documentElement.classList.add('jayam-intro');
          }
        } catch (error) {}
      })();
    </script>
    <style>
      html.jayam-intro, html.jayam-intro body { background: #000; }
      html.jayam-intro #root { visibility: hidden; }
    </style>
  </head>
  <body class="bg-brand-pearl">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
